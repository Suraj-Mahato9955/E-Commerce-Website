<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wishlist - ShopEase</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        .wishlist-page {
            padding: 70px 0;
            min-height: 70vh;
        }

        .wishlist-heading {
            text-align: center;
            margin-bottom: 45px;
        }

        .wishlist-heading h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .wishlist-heading p {
            color: #aaa;
        }

        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .wishlist-card {
            background: #171a20;
            border: 1px solid #2a2e36;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
        }

        .wishlist-card:hover {
            transform: translateY(-5px);
            border-color: #00c9a7;
        }

        .wishlist-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
        }

        .wishlist-card-content {
            padding: 20px;
        }

        .wishlist-card-content h3 {
            margin-bottom: 8px;
        }

        .wishlist-category {
            color: #00c9a7;
            font-size: 14px;
            margin-bottom: 10px;
            display: block;
        }

        .wishlist-price {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .wishlist-actions {
            display: flex;
            gap: 10px;
        }

        .wishlist-add-cart {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #00c9a7;
            color: #111;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .wishlist-remove {
            width: 45px;
            border: 1px solid #2a2e36;
            border-radius: 7px;
            background: #0f1115;
            color: #ff4d6d;
            cursor: pointer;
        }

        .wishlist-remove:hover {
            border-color: #ff4d6d;
        }

        .wishlist-empty {
            text-align: center;
            padding: 70px 20px;
            background: #171a20;
            border: 1px solid #2a2e36;
            border-radius: 12px;
        }

        .wishlist-empty i {
            font-size: 55px;
            color: #ff4d6d;
            margin-bottom: 20px;
        }

        .wishlist-empty h2 {
            margin-bottom: 10px;
        }

        .wishlist-empty p {
            color: #aaa;
            margin-bottom: 25px;
        }

        .wishlist-empty a {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 8px;
            background: #00c9a7;
            color: #111;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 900px) {
            .wishlist-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .wishlist-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>

<body>


<header class="header">

    <div class="container nav">

        <a href="index.html" class="logo">
            Shop<span>Ease</span>
        </a>

        <nav>

            <a href="index.html">Home</a>

            <a href="shop.html">Shop</a>

            <a href="about.html">About</a>

            <a href="blog.html">Blog</a>

            <a href="contact.html">Contact</a>

        </nav>

        <a href="cart.html" class="cart-link">

            <i class="fa-solid fa-cart-shopping"></i>

            <span id="cart-count">0</span>

        </a>

    </div>

</header>


<main class="wishlist-page">

    <div class="container">

        <div class="wishlist-heading">

            <h1>
                My Wishlist
            </h1>

            <p>
                Products you've saved for later.
            </p>

        </div>


        <div
            class="wishlist-grid"
            id="wishlist-container"
        ></div>

    </div>

</main>


<footer class="footer">

    <div class="container">

        <p>
            © 2026 ShopEase. All Rights Reserved.
        </p>

    </div>

</footer>


<script src="js/script.js"></script>


<script>

    const wishlistContainer =
        document.getElementById(
            "wishlist-container"
        );


    let savedWishlist =
        JSON.parse(
            localStorage.getItem("wishlist")
        ) || [];


    let savedCart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];


    const wishlistProducts = {

        "Classic Watch": {
            category: "Accessories",
            price: 49.99,
            image: "https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=800&q=80"
        },

        "Fashion T-Shirt": {
            category: "Clothing",
            price: 24.99,
            image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80"
        },

        "Running Shoes": {
            category: "Footwear",
            price: 69.99,
            image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80"
        },

        "Wireless Headphones": {
            category: "Electronics",
            price: 89.99,
            image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80"
        },

        "Premium Coffee Mug": {
            category: "Home",
            price: 14.99,
            image: "https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?auto=format&fit=crop&w=800&q=80"
        },

        "Leather Bag": {
            category: "Bags",
            price: 79.99,
            image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=800&q=80"
        }

    };


    function renderWishlist() {

        wishlistContainer.innerHTML = "";


        if (savedWishlist.length === 0) {

            wishlistContainer.innerHTML = `

                <div class="wishlist-empty">

                    <i class="fa-regular fa-heart"></i>

                    <h2>
                        Your Wishlist is Empty
                    </h2>

                    <p>
                        Save products you love and find them here.
                    </p>

                    <a href="shop.html">
                        Explore Products
                    </a>

                </div>

            `;

            return;

        }


        savedWishlist.forEach(
            function(productName) {

                const product =
                    wishlistProducts[
                        productName
                    ];


                if (!product) {
                    return;
                }


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "wishlist-card";


                card.innerHTML = `

                    <img
                        src="${product.image}"
                        alt="${productName}"
                    >

                    <div class="wishlist-card-content">

                        <span class="wishlist-category">
                            ${product.category}
                        </span>

                        <h3>
                            ${productName}
                        </h3>

                        <div class="wishlist-price">
                            $${product.price.toFixed(2)}
                        </div>

                        <div class="wishlist-actions">

                            <button
                                class="wishlist-add-cart"
                                data-name="${productName}"
                            >
                                Add to Cart
                            </button>

                            <button
                                class="wishlist-remove"
                                data-name="${productName}"
                                title="Remove"
                            >
                                <i class="fa-solid fa-trash"></i>
                            </button>

                        </div>

                    </div>

                `;


                wishlistContainer.appendChild(
                    card
                );

            }
        );


        // ADD TO CART

        document
            .querySelectorAll(
                ".wishlist-add-cart"
            )
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function() {

                            const name =
                                button.getAttribute(
                                    "data-name"
                                );


                            const product =
                                wishlistProducts[
                                    name
                                ];


                            const existing =
                                savedCart.find(
                                    function(item) {
                                        return item.name === name;
                                    }
                                );


                            if (existing) {

                                existing.quantity =
                                    (existing.quantity || 1) + 1;

                            } else {

                                savedCart.push({

                                    name: name,

                                    price: product.price,

                                    quantity: 1

                                });

                            }


                            localStorage.setItem(
                                "cart",
                                JSON.stringify(
                                    savedCart
                                )
                            );


                            alert(
                                name +
                                " added to cart!"
                            );

                        }
                    );

                }
            );


        // REMOVE FROM WISHLIST

        document
            .querySelectorAll(
                ".wishlist-remove"
            )
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function() {

                            const name =
                                button.getAttribute(
                                    "data-name"
                                );


                            savedWishlist =
                                savedWishlist.filter(
                                    function(item) {
                                        return item !== name;
                                    }
                                );


                            localStorage.setItem(
                                "wishlist",
                                JSON.stringify(
                                    savedWishlist
                                )
                            );


                            renderWishlist();

                        }
                    );

                }
            );

    }


    renderWishlist();

</script>

</body>
</html>
